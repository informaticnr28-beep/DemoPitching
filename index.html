    function pcmToWavBlob(pcm16Data, sampleRate = 24000) {
      const buffer = new ArrayBuffer(44 + pcm16Data.length * 2);
      const view = new DataView(buffer);

      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + pcm16Data.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcm16Data.length * 2, true);

      let offset = 44;
      for (let i = 0; i < pcm16Data.length; i++, offset += 2) {
        view.setInt16(offset, pcm16Data[i], true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function fetchGeminiTTS(text, voiceName = "Kore", apiKey) {
      if (!apiKey) return null;
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{
          parts: [{ text: `Say clearly in natural pitch accent: ${text}` }]
        }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: voiceName }
            }
          }
        }
      };

      let retries = 0;
      while (retries < 3) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

          const result = await response.json();
          const part = result?.candidates?.[0]?.content?.parts?.[0];
          const audioData = part?.inlineData?.data;
          const mimeType = part?.inlineData?.mimeType || "audio/L16;rate=24000";

          if (audioData) {
            let sampleRate = 24000;
            const rateMatch = mimeType.match(/rate=(\d+)/);
            if (rateMatch && rateMatch[1]) {
              sampleRate = parseInt(rateMatch[1], 10);
            }
            const buffer = base64ToArrayBuffer(audioData);
            const pcm16 = new Int16Array(buffer);
            const wavBlob = pcmToWavBlob(pcm16, sampleRate);
            return URL.createObjectURL(wavBlob);
          }
        } catch (err) {
          retries++;
          await new Promise(res => setTimeout(res, 1000 * Math.pow(2, retries)));
        }
      }
      return null;
    }

    async function evaluatePitchSpeechWithGemini(expectedScript, spokenText, keywords = [], apiKey) {
      if (!apiKey) throw new Error("Missing API Key");
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      const systemPrompt = "คุณคือโค้ชสอนการสปีชและ Pitching มืออาชีพ ทำหน้าที่ประเมินการพูดของผู้ใช้งาน เปรียบเทียบกับสคริปต์ที่เตรียมไว้ ให้คำแนะนำและคะแนนอย่างเป็นมิตร";
      const userPrompt = `
      สคริปต์ที่เตรียมไว้ (Expected Script):
      "${expectedScript}"

      คำสำคัญที่ควรมี (Keywords):
      ${keywords.join(", ")}

      ข้อความที่ผู้ใช้พูดจริง (Spoken Text):
      "${spokenText}"

      กรุณาวิเคราะห์และตอบกลับในรูปแบบ JSON ดังนี้:
      {
        "accuracyScore": 85, (0-100 คะแนนความตรงตามเนื้อหา)
        "clarityScore": 90, (0-100 คะแนนความชัดเจนและการจับประเด็น)
        "missingKeywords": ["คำที่ตกหล่น"],
        "strengthPoints": ["จุดเด่นของการพูดครั้งนี้"],
        "improvementTips": ["ข้อควรปรับปรุงหรือเทคนิคการจำ"],
        "coachingSummary": "สรุปคำแนะนำสั้นๆ 2-3 ประโยคเพื่อสร้างกำลังใจ"
      }
      `;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        if (!response.ok) throw new Error("API call failed");
        const resJson = await response.json();
        const jsonText = resJson.candidates[0].content.parts[0].text;
        return JSON.parse(jsonText);
      } catch (e) {
        return {
          accuracyScore: 75,
          clarityScore: 80,
          missingKeywords: keywords.filter(k => !spokenText.includes(k)),
          strengthPoints: ["สามารถพูดครอบคลุมใจความสำคัญได้ดี"],
          improvementTips: ["ลองเน้นคำสำคัญให้ชัดเจนยิ่งขึ้น และควบคุมจังหวะหายใจ", "ตรวจสอบ API Key อีกครั้งหากพบปัญหาขัดข้อง"],
          coachingSummary: "ทำได้ดีมากครับ! เนื้อหาโดยรวมสื่อสารได้เข้าใจ ลองซ้อมบ่อยๆ เพื่อให้เป็นธรรมชาติยิ่งขึ้น"
        };
      }
    }

    async function convertRawTextToSlidesWithGemini(rawContent, apiKey) {

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      {

            "notes": "คำแนะนำการพูด"
          }
        ]
      }

      เนื้อหาดิบ:
      "${rawContent}"
      `;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        if (!response.ok) throw new Error("API call failed");

    function App() {
      // API Key State
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('pitchmaster_api_key') || '');
      const [showApiModal, setShowApiModal] = useState(!localStorage.getItem('pitchmaster_api_key'));
      const [tempKeyInput, setTempKeyInput] = useState('');

      // Script State Management
      const [scriptsList, setScriptsList] = useState(() => {
        const saved = localStorage.getItem('pitchmaster_scripts');
        return saved ? JSON.parse(saved) : [DEFAULT_SNAPCHILL_SCRIPT];
      });
      const [activeScriptId, setActiveScriptId] = useState(() => {
        return scriptsList[0]?.id || "snapchill-demo";
      });

      const currentScript = useMemo(() => {
        return scriptsList.find(s => s.id === activeScriptId) || scriptsList[0];
      }, [scriptsList, activeScriptId]);

      // Navigation & Practice States
      const [activeTab, setActiveTab] = useState('practice'); // 'practice', 'teleprompter', 'editor', 'analytics'
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

      // Slide Practice States
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [audioLoading, setAudioLoading] = useState(false);
      const [selectedVoice, setSelectedVoice] = useState('Kore'); // Gemini Kore, Zephyr, Puck
      const [playbackRate, setPlaybackRate] = useState(1);
      
      // Memory Blur Mode
      const [memoryMode, setMemoryMode] = useState(0);

      // Speech Recording States
      const [isRecording, setIsRecording] = useState(false);
      const [transcript, setTranscript] = useState('');
      const [recordingTime, setRecordingTime] = useState(0);
      const [aiEvaluating, setAiEvaluating] = useState(false);
      const [evaluationResult, setEvaluationResult] = useState(null);

      // Audio Elements & Speech Recognition Refs
      const audioRef = useRef(null);
      const recognitionRef = useRef(null);
      const timerIntervalRef = useRef(null);

      // Re-render Lucide icons when state/tabs change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // LocalStorage Persistence
      useEffect(() => {
        localStorage.setItem('pitchmaster_scripts', JSON.stringify(scriptsList));
      }, [scriptsList]);

      // Setup Speech Recognition
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'th-TH';

          rec.onresult = (event) => {
            let interimTranscript = '';
            let finalTrans = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                finalTrans += event.results[i][0].transcript;
              } else {
                interimTranscript += event.results[i][0].transcript;
              }
            }
            setTranscript(prev => finalTrans ? prev + ' ' + finalTrans : prev || interimTranscript);
          };

          rec.onend = () => {
            if (isRecording) {
              try { rec.start(); } catch(e) {}
            }
          };

          recognitionRef.current = rec;
        }
      }, [isRecording]);

      const handleSaveApiKey = () => {
        if(tempKeyInput.trim().length > 10) {
          localStorage.setItem('pitchmaster_api_key', tempKeyInput.trim());
          setApiKey(tempKeyInput.trim());
          setShowApiModal(false);
        } else {
          alert('กรุณากรอก API Key ที่ถูกต้อง');
        }
      };

      const handleClearApiKey = () => {
        localStorage.removeItem('pitchmaster_api_key');
        setApiKey('');
        setShowApiModal(true);
      };

      const currentSlide = currentScript?.slides[currentSlideIndex] || currentScript?.slides[0];

      useEffect(() => {
        stopAudio();
        stopRecording();
        setTranscript('');
        setEvaluationResult(null);
        setRecordingTime(0);
      }, [currentSlideIndex, activeScriptId]);

      const handlePlayAudio = async () => {
        if (isPlayingAudio) {
          stopAudio();
          return;
        }

        if (!apiKey) {
          alert('กรุณาตั้งค่า Gemini API Key ก่อนใช้งาน AI Voice');
          setShowApiModal(true);
          return;
        }

        setAudioLoading(true);
        try {
          const audioUrl = await fetchGeminiTTS(currentSlide.script, selectedVoice, apiKey);
          if (audioUrl) {
            if (audioRef.current) {
              audioRef.current.pause();
            }
            const audio = new Audio(audioUrl);
            audio.playbackRate = playbackRate;
            audioRef.current = audio;
            audio.onended = () => setIsPlayingAudio(false);
            audio.play();
            setIsPlayingAudio(true);
          } else {
            // Fallback
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(currentSlide.script);
              utterance.lang = 'th-TH';
              utterance.rate = playbackRate;
              utterance.onend = () => setIsPlayingAudio(false);
              window.speechSynthesis.speak(utterance);
              setIsPlayingAudio(true);
            } else {
              alert("ระบบของคุณไม่รองรับการเล่นเสียง");
            }
          }
        } catch (err) {
          console.error("Audio Playback Error:", err);
        } finally {
          setAudioLoading(false);
        }
      };

      const stopAudio = () => {
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setIsPlayingAudio(false);
      };

      const startRecording = () => {
        stopAudio();
        setTranscript('');
        setEvaluationResult(null);
        setRecordingTime(0);
        setIsRecording(true);

        if (recognitionRef.current) {
          try {
            recognitionRef.current.start();
          } catch (e) {}
        } else {
            alert('เบราว์เซอร์ของคุณไม่รองรับการบันทึกเสียง (แนะนำใช้ Chrome หรือ Edge)');
            setIsRecording(false);
            return;
        }

        timerIntervalRef.current = setInterval(() => {
          setRecordingTime(prev => prev + 1);
        }, 1000);
      };

      const stopRecording = () => {
        setIsRecording(false);
        if (recognitionRef.current) {
          try {
            recognitionRef.current.stop();
          } catch (e) {}
        }
        if (timerIntervalRef.current) {
          clearInterval(timerIntervalRef.current);
        }
      };

      const handleAnalyzeSpeech = async () => {
        stopRecording();
        if (!transcript.trim()) {
          alert("ไม่พบข้อความที่อัดเสียง กรุณาพูดใส่ไมค์ก่อนทำการวิเคราะห์");
          return;
        }
        
        if (!apiKey) {
          alert('กรุณาตั้งค่า Gemini API Key ก่อนให้ AI ประเมินการพูด');
          setShowApiModal(true);
          return;
        }

        setAiEvaluating(true);
        const res = await evaluatePitchSpeechWithGemini(currentSlide.script, transcript, currentSlide.keywords || [], apiKey);
        setEvaluationResult(res);
        setAiEvaluating(false);

        setScriptsList(prevScripts => {
          return prevScripts.map(sc => {
            if (sc.id !== currentScript.id) return sc;
            const updatedSlides = sc.slides.map(sl => {
              if (sl.id !== currentSlide.id) return sl;
              return {
                ...sl,
                bestScore: Math.max(sl.bestScore || 0, res.accuracyScore),
                practicedCount: (sl.practicedCount || 0) + 1
              };
            });
            return { ...sc, slides: updatedSlides };
          });
        });
      };

      const renderScriptWithMemoryMode = (text, keywords = []) => {
        if (memoryMode === 0) return <span>{text}</span>;

        if (memoryMode === 1) { 
          let parts = [text];
          keywords.forEach(kw => {
            parts = parts.flatMap(part => {
              if (typeof part !== 'string') return [part];
              const subParts = part.split(kw);
              const result = [];
              subParts.forEach((sp, idx) => {
                if (idx > 0) {
                  result.push(<mark key={kw + idx} class="bg-teal-500/30 text-teal-200 px-1.5 py-0.5 rounded font-medium border border-teal-500/40">{kw}</mark>);
                }
                result.push(sp);
              });
              return result;
            });
          });
          return <span>{parts}</span>;
        }

        if (memoryMode === 2) { 
          const words = text.split(' ');
          return (
            <span>
              {words.map((w, idx) => (
                idx % 2 === 1 ? (
                  <span key={idx} class="blur-sm bg-slate-800 text-transparent select-none mx-0.5 px-1 rounded transition-all hover:blur-none hover:text-slate-300 hover:bg-slate-700">{w} </span>
                ) : (
                  <span key={idx}>{w} </span>
                )
              ))}
            </span>
          );
        }

        if (memoryMode === 3) { 
          return (
            <div class="text-center py-8">
              <span class="inline-block bg-slate-800 text-slate-400 px-4 py-2 rounded-full border border-slate-700 text-sm">
                🔒 ซ่อนสคริปต์ทั้งหมด (ลองพูดจากความทรงจำของคุณ!)
              </span>
              <p class="text-xs text-slate-500 mt-2">คำสำคัญบอกใบ้: {keywords.join(" • ")}</p>
            </div>
          );
        }
      };

      return (
        <div class="flex flex-col min-h-screen bg-slate-950 text-slate-100">

            <div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
              <div class="bg-slate-900 border border-teal-500/50 p-6 rounded-2xl shadow-2xl max-w-md w-full">
                <div class="flex items-center gap-3 mb-4">

                    <i data-lucide="key" class="w-5 h-5"></i>

                </div>

                  แอปนี้ต้องการใช้ <strong>Google Gemini API</strong> เพื่อสร้างเสียงพูด (TTS) และการให้ AI ประเมินการ Pitching ของคุณ ข้อมูลคีย์จะถูกเก็บไว้ในเครื่องของคุณเท่านั้น (Local Storage)
                </p>

                  <label class="text-xs text-slate-400 block mb-1">กรอก API Key ของคุณ:</label>

                    onChange={(e) => setTempKeyInput(e.target.value)}
                    placeholder="AIzaSy..."

                  />
                  <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" class="text-xs text-teal-400 hover:underline mt-2 inline-block">
                    รับ API Key ฟรีที่ Google AI Studio ↗
                  </a>
                </div>
                <div class="flex gap-3 justify-end">
                  {apiKey && (
                    <button onClick={() => setShowApiModal(false)} class="px-4 py-2 text-sm text-slate-400 hover:text-white">ยกเลิก</button>
                  )}
                  <button onClick={handleSaveApiKey} class="bg-teal-600 hover:bg-teal-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                    บันทึกและเริ่มต้นใช้งาน

    function TeleprompterRunner({ script }) {
      const [autoScroll, setAutoScroll] = useState(false);
      const [scrollSpeed, setScrollSpeed] = useState(2); 
      const [fontSize, setFontSize] = useState(28); 
      const [elapsedTime, setElapsedTime] = useState(0);
      const [activeSlideIdx, setActiveSlideIdx] = useState(0);
      
      const prompterRef = useRef(null);
      const timerRef = useRef(null);

      useEffect(() => {
        let scrollInterval = null;
        if (autoScroll) {
          scrollInterval = setInterval(() => {
            if (prompterRef.current) {
              prompterRef.current.scrollTop += scrollSpeed;
            }
          }, 50);

          timerRef.current = setInterval(() => {
            setElapsedTime(t => t + 1);
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }

        return () => {
          clearInterval(scrollInterval);
          clearInterval(timerRef.current);
        };
      }, [autoScroll, scrollSpeed]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      return (
        <div class="max-w-5xl mx-auto space-y-4">
          
          <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div class="flex items-center space-x-3">
              <button
                onClick={() => setAutoScroll(!autoScroll)}
                class={`px-5 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg transition-all ${
                  autoScroll ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-teal-600 hover:bg-teal-500 text-white'
                }`}
              >
                {autoScroll ? <i data-lucide="pause" class="w-4 h-4"></i> : <i data-lucide="play" class="w-4 h-4"></i>}
                {autoScroll ? 'หยุดเลื่อน' : 'เริ่มซ้อมรวดเดียว (Auto-Scroll)'}
              </button>

              <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                <span class="text-slate-400">ความเร็ว:</span>
                <input 
                  type="range" 
                  min="1" 
                  max="5" 
                  value={scrollSpeed} 
                  onChange={(e) => setScrollSpeed(Number(e.target.value))}
                  class="w-20 accent-teal-500"
                />
                <span class="font-mono text-teal-400">{scrollSpeed}x</span>
              </div>

              <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                <span class="text-slate-400">ขนาดอักษร:</span>
                <button onClick={() => setFontSize(s => Math.max(18, s - 2))} class="px-2 py-0.5 bg-slate-700 rounded">-</button>
                <span class="font-mono text-teal-400">{fontSize}px</span>
                <button onClick={() => setFontSize(s => Math.min(48, s + 2))} class="px-2 py-0.5 bg-slate-700 rounded">+</button>
              </div>
            </div>

            <div class="flex items-center space-x-4 font-mono">
              <div class="text-right">
                <span class="text-[10px] text-slate-400 block">เวลารวมที่ใช้</span>
                <span class="text-lg font-bold text-teal-400">{formatTime(elapsedTime)}</span>
              </div>
              <button
                onClick={() => {
                  setElapsedTime(0);
                  if (prompterRef.current) prompterRef.current.scrollTop = 0;
                }}
                class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl border border-slate-700 text-xs"
                title="รีเซ็ตเวลา"
              >
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div 
            ref={prompterRef}
            class="bg-slate-950 rounded-2xl border border-slate-800 p-8 md:p-12 h-[600px] overflow-y-auto custom-scrollbar relative space-y-12"
          >
            {script.slides.map((slide, idx) => (
              <div 
                key={slide.id} 
                class={`p-6 rounded-2xl border transition-all ${
                  activeSlideIdx === idx ? 'bg-slate-900/90 border-teal-500/50 shadow-2xl' : 'bg-slate-900/30 border-slate-800/60 opacity-80'
                }`}
                onClick={() => setActiveSlideIdx(idx)}
              >
                <div class="flex items-center justify-between mb-3 border-b border-slate-800/80 pb-2">
                  <span class="text-xs font-mono font-bold text-teal-400 bg-teal-500/10 px-2.5 py-1 rounded-md border border-teal-500/20">
                    {slide.title}
                  </span>
                  <span class="text-xs text-slate-500">เป้าหมายเวลา ~{slide.durationSec} วินาที</span>
                </div>
                <p 
                  style={{ fontSize: `${fontSize}px`, lineHeight: '1.6' }} 
                  class="font-normal text-slate-100 tracking-wide"
                >
                  {slide.script}
                </p>
              </div>
            ))}
          </div>

        </div>
      );
    }

    function ScriptEditorView({ scriptsList, setScriptsList, activeScriptId, setActiveScriptId, apiKey, setShowApiModal }) {
      const activeScript = scriptsList.find(s => s.id === activeScriptId) || scriptsList[0];
      const [rawAiPrompt, setRawAiPrompt] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const handleSlideChange = (slideId, field, value) => {
        setScriptsList(prev => prev.map(sc => {
          if (sc.id !== activeScriptId) return sc;
          const updatedSlides = sc.slides.map(sl => {
            if (sl.id !== slideId) return sl;
            return { ...sl, [field]: value };
          });
          return { ...sc, slides: updatedSlides };
        }));
      };

      const handleAddSlide = () => {
        const newSlideNum = activeScript.slides.length + 1;
        const newSlide = {
          id: Date.now(),
          slideNumber: newSlideNum,
          title: `สไลด์ ${newSlideNum}: หัวข้อใหม่`,
          script: "พิมพ์สคริปต์พูดที่นี่...",
          keywords: ["คำสำคัญ"],
          durationSec: 20,
          notes: "คำแนะนำเพิ่มเติม"
        };

        setScriptsList(prev => prev.map(sc => {
          if (sc.id !== activeScriptId) return sc;
          return { ...sc, slides: [...sc.slides, newSlide] };
        }));
      };

      const handleDeleteSlide = (slideId) => {
        if (activeScript.slides.length <= 1) {
          alert("สคริปต์ต้องมีอย่างน้อย 1 สไลด์");
          return;
        }
        setScriptsList(prev => prev.map(sc => {
          if (sc.id !== activeScriptId) return sc;
          const filtered = sc.slides.filter(sl => sl.id !== slideId);
          const renumbered = filtered.map((sl, idx) => ({ ...sl, slideNumber: idx + 1 }));
          return { ...sc, slides: renumbered };
        }));
      };

      const handleGenerateScriptWithAi = async () => {
        if (!rawAiPrompt.trim()) {
          alert("กรุณากรอกเนื้อหา หรือโครงร่างที่คุณต้องการให้ AI แปลงเป็นสไลด์");
          return;
        }

        if (!apiKey) {
          alert("กรุณาตั้งค่า Gemini API Key เพื่อใช้งานฟังก์ชันนี้");
          setShowApiModal(true);
          return;
        }

        setIsGenerating(true);
        const newScriptData = await convertRawTextToSlidesWithGemini(rawAiPrompt, apiKey);
        setIsGenerating(false);

        if (newScriptData) {
          const newId = "script-" + Date.now();
          const formattedScript = {
            id: newId,
            title: newScriptData.title || "สคริปต์ใหม่จาก Gemini AI",
            description: newScriptData.description || "สร้างโดย AI จากเนื้อหาดิบของคุณ",
            slides: newScriptData.slides.map((s, idx) => ({
              ...s,
              id: Date.now() + idx,
              slideNumber: idx + 1
            }))
          };

          setScriptsList(prev => [...prev, formattedScript]);
          setActiveScriptId(newId);
          setRawAiPrompt('');
          alert("สร้างสคริปต์ใหม่สำเร็จแล้ว!");
        }
      };

      return (
        <div class="space-y-8 max-w-6xl mx-auto">
          
          <div class="bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 p-6 rounded-2xl border border-indigo-500/30 shadow-xl">
            <h2 class="text-base font-bold text-white flex items-center gap-2 mb-2">
              <i data-lucide="wand-2" class="w-5 h-5 text-indigo-400"></i> ให้ Gemini AI แปลงเนื้อหาเป็นสไลด์ซ้อมพูดให้อัตโนมัติ
            </h2>
            <p class="text-xs text-slate-400 mb-4">วางเนื้อหา บทความ หรือรายละเอียดไอเดียของคุณ แล้ว AI จะทำการสรุปและแบ่งเป็นสไลด์พร้อมคำสำคัญให้อย่างลงตัว</p>

            <textarea
              rows="3"
              value={rawAiPrompt}
              onChange={(e) => setRawAiPrompt(e.target.value)}
              placeholder="ตัวอย่าง: วางสคริปต์หรือบทพูดสินค้าของคุณลงที่นี่..."
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />

            <div class="mt-3 flex justify-end">
              <button
                onClick={handleGenerateScriptWithAi}
                disabled={isGenerating}
                class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-medium flex items-center gap-2 shadow-lg shadow-indigo-600/20 transition-all disabled:opacity-50"
              >
                {isGenerating ? (
                  <>กำลังสร้างสคริปต์สไลด์...</>
                ) : (
                  <><i data-lucide="sparkles" class="w-4 h-4"></i> แปลงเป็นสคริปต์ Pitching</>
                )}
              </button>
            </div>
          </div>

          <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
              <div>
                <h2 class="text-base font-bold text-white">แก้ไขเนื้อหาสคริปต์: {activeScript.title}</h2>
                <p class="text-xs text-slate-400">ปรับแต่งบทพูด คำสำคัญ และสไลด์แต่ละหน้าได้ตามต้องการ</p>
              </div>

              <button
                onClick={handleAddSlide}
                class="bg-teal-600 hover:bg-teal-500 text-white text-xs px-3 py-2 rounded-xl font-medium flex items-center gap-1.5"
              >
                <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มสไลด์ใหม่
              </button>
            </div>

            <div class="space-y-4">
              {activeScript.slides.map((slide) => (
                <div key={slide.id} class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                  <div class="flex items-center justify-between gap-3">
                    <span class="text-xs font-mono font-bold text-teal-400 bg-teal-500/10 px-2.5 py-1 rounded">
                      สไลด์ #{slide.slideNumber}
                    </span>
                    <input 
                      type="text"
                      value={slide.title}
                      onChange={(e) => handleSlideChange(slide.id, 'title', e.target.value)}
                      class="flex-grow bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 text-xs font-semibold text-slate-200 focus:outline-none focus:ring-1 focus:ring-teal-500"
                    />
                    <button
                      onClick={() => handleDeleteSlide(slide.id)}
                      class="text-slate-500 hover:text-red-400 p-1 text-xs"
                      title="ลบสไลด์นี้"
                    >
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>

                  <div>
                    <label class="text-[11px] text-slate-400 block mb-1">บทพูดที่ต้องซ้อมพูด:</label>
                    <textarea 
                      rows="3"
                      value={slide.script}
                      onChange={(e) => handleSlideChange(slide.id, 'script', e.target.value)}
                      class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-teal-500 leading-relaxed"
                    />
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label class="text-[11px] text-slate-400 block mb-1">คำสำคัญ (ขั้นด้วยเครื่องหมายจุลภาค ,):</label>
                      <input 
                        type="text"
                        value={Array.isArray(slide.keywords) ? slide.keywords.join(', ') : slide.keywords}
                        onChange={(e) => handleSlideChange(slide.id, 'keywords', e.target.value.split(',').map(k => k.trim()))}
                        class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-teal-500"
                      />
                    </div>
                    <div>
                      <label class="text-[11px] text-slate-400 block mb-1">คำแนะนำ / โน้ตการนำเสนอ:</label>
                      <input 
                        type="text"
                        value={slide.notes || ''}
                        onChange={(e) => handleSlideChange(slide.id, 'notes', e.target.value)}
                        class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-teal-500"
                      />
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    function AnalyticsView({ script }) {
      const totalSlides = script.slides.length;
      const practicedSlides = script.slides.filter(s => (s.practicedCount || 0) > 0).length;
      const avgScore = Math.round(
        script.slides.reduce((acc, s) => acc + (s.bestScore || 0), 0) / totalSlides
      );

      return (
        <div class="max-w-5xl mx-auto space-y-6">
          
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
              <span class="text-xs text-slate-400 block">สไลด์ที่ซ้อมไปแล้ว</span>
              <span class="text-2xl font-bold text-teal-400 mt-1 block">{practicedSlides} / {totalSlides} หน้า</span>
              <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                <div class="bg-teal-500 h-full rounded-full" style={{ width: `${(practicedSlides / totalSlides) * 100}%` }}></div>
              </div>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
              <span class="text-xs text-slate-400 block">คะแนนความแม่นยำเฉลี่ย</span>
              <span class="text-2xl font-bold text-indigo-400 mt-1 block">{avgScore || 0}%</span>
              <p class="text-[11px] text-slate-500 mt-2">คำนวณจากสไลด์ทั้งหมดที่มีการบันทึกเสียง</p>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
              <span class="text-xs text-slate-400 block">สถานะความพร้อม Pitching</span>
              <span class="text-2xl font-bold text-emerald-400 mt-1 block">
                {avgScore > 80 ? 'พร้อมนำเสนอสูง! 🚀' : avgScore > 50 ? 'กำลังเข้าที่เข้าทาง 👍' : 'ควรซ้อมเพิ่มอีกนิด 💪'}
              </span>
              <p class="text-[11px] text-slate-500 mt-2">ฝึกซ้อมสม่ำเสมอช่วยสร้างความมั่นใจ</p>
            </div>
          </div>

          <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
              <i data-lucide="list-checks" class="w-4 h-4 text-teal-400"></i> รายละเอียดความพร้อมรายสไลด์
            </h3>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800">
                  <tr>
                    <th class="p-3">สไลด์</th>
                    <th class="p-3">หัวข้อสไลด์</th>
                    <th class="p-3">จำนวนซ้อม</th>
                    <th class="p-3">คะแนนดีสุด</th>
                    <th class="p-3">สถานะ</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  {script.slides.map(s => (
                    <tr key={s.id} class="hover:bg-slate-800/40 transition-colors">
                      <td class="p-3 font-mono font-bold text-teal-400">#{s.slideNumber}</td>
                      <td class="p-3 font-medium text-slate-200">{s.title}</td>
                      <td class="p-3 font-mono">{s.practicedCount || 0} ครั้ง</td>
                      <td class="p-3 font-mono font-bold text-indigo-400">{s.bestScore ? `${s.bestScore}%` : '-'}</td>
                      <td class="p-3">
                        {s.bestScore >= 80 ? (
                          <span class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/30">จำได้แม่น</span>
                        ) : s.bestScore >= 50 ? (
                          <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">ซ้อมเพิ่มได้</span>
                        ) : (
                          <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded">ยังไม่ซ้อม</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    window.onload = function() {
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    };
  </script>
</body>
</html>
